<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>AI Domain Check</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans KR', sans-serif;
      font-size: 13px;
      color: #1f2937;
      background: #ffffff;
    }
    .header {
      padding: 14px 16px 12px;
      border-bottom: 1px solid #e5e7eb;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      color: #ffffff;
      letter-spacing: 0.02em;
    }
    .status.official { background: #10b981; }
    .status.suspicious { background: #ef4444; }
    .status.unverified { background: #f59e0b; }
    .status.unsupported { background: #9ca3af; }
    .hostname {
      margin-top: 8px;
      font-size: 14px;
      font-weight: 600;
      color: #111827;
      word-break: break-all;
    }
    .body {
      padding: 14px 16px;
    }
    .body:empty {
      display: none;
    }
    .row {
      margin-bottom: 10px;
    }
    .row:last-child {
      margin-bottom: 0;
    }
    .row-label {
      font-size: 10px;
      font-weight: 700;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 3px;
    }
    .row-value {
      color: #111827;
      line-height: 1.45;
    }
    .evidence a {
      display: block;
      color: #2563eb;
      text-decoration: none;
      margin-bottom: 3px;
      word-break: break-all;
      font-size: 12px;
    }
    .evidence a:hover {
      text-decoration: underline;
    }
    .notice {
      padding: 10px 16px;
      font-size: 12px;
      line-height: 1.5;
      border-top: 1px solid #fde68a;
      background: #fef3c7;
      color: #92400e;
    }
    .notice.suspicious {
      background: #fee2e2;
      color: #991b1b;
      border-top-color: #fecaca;
    }
    .notice:empty {
      display: none;
    }
    .footer {
      padding: 10px 16px;
      border-top: 1px solid #e5e7eb;
      display: flex;
      gap: 8px;
      align-items: center;
      font-size: 11px;
      color: #6b7280;
    }
    .footer button {
      font: inherit;
      padding: 4px 10px;
      background: #f3f4f6;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      color: #1f2937;
      cursor: pointer;
    }
    .footer button:hover:not(:disabled) {
      background: #e5e7eb;
    }
    .footer button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .meta {
      margin-left: auto;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <div class="header">
    <div id="status" class="status unsupported">로딩</div>
    <div id="hostname" class="hostname">—</div>
  </div>
  <div id="body" class="body"></div>
  <div id="notice" class="notice"></div>
  <div class="footer">
    <button id="report-btn" type="button">신고</button>
    <button id="refresh-btn" type="button">새로고침</button>
    <span id="meta" class="meta"></span>
  </div>
  <script src="../../dist/popup/popup.js"></script>
</body>
</html>
